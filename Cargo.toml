[workspace]
members = ["crates/soundlock-dsp"]
resolver = "2"

[package]
name = "sound-lock"
version = "0.1.2"
edition = "2024"
rust-version = "1.88"
description = "A Windows tray app for quieter peaks, clearer quiet scenes and up to 4x gain"
license = "MIT"

[features]
screenshot = ["eframe/__screenshot"]

[dependencies]
anyhow = "1"
cpal = "=0.17.3"
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
rtrb = "=0.3.2"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
soundlock-dsp = { path = "crates/soundlock-dsp" }
sha2 = "0.10"
tempfile = "3"
ureq = { version = "=3.5.0", default-features = false, features = ["native-tls-no-default"] }
zip = { version = "=4.6.1", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "=0.21.3", default-features = false }
windows = { version = "0.61", features = ["Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_WinRT", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Security_WinTrust", "Win32_Security_Cryptography", "Win32_Foundation"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
