name: Checked release builds
'on':
  workflow_call: {}
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: '2'
jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Provision shared updater source
      shell: pwsh
      run: ./scripts/provision-shared-updater.ps1
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      with:
        components: rustfmt, clippy
        toolchain: stable
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
    - run: cargo fmt --all -- --check
    - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
    - run: cargo test --workspace --locked
    - run: cargo build --release --locked
    - name: Verify the shared updater on temporary apps
      run: cargo run --manifest-path ../rust-auto-updator/Cargo.toml -p rust-auto-updator --example native-smoke
        --features smoke-test --locked -- --test-updater
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: sound-lock-windows-x64
        path: |
          target/release/sound-lock.exe
          LICENSE
          README.md
          docs/screenshots/*.png
          vendor/egui-software/LICENSE-*
          licenses/*.txt
    permissions:
      contents: read
    timeout-minutes: 30
