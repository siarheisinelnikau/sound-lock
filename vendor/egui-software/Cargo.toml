[package]
name = "egui_software_backend"
version = "0.0.2"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Pinned CPU rasterizer adapted to Sound Lock's egui version"
repository = "https://github.com/DGriffin91/egui_software_backend"

[features]
default = ["std"]
std = []
winit = []
test_render = []
raster_stats = ["std"]
log = ["dep:log"]
rayon = ["dep:rayon"]

[dependencies]
ahash = "0.8"
egui = { version = "=0.37.0", default-features = false }
constify = "0.0.1"
strength_reduce = "0.2.4"
log = { version = "0.4", optional = true }
rayon = { version = "1.11", optional = true }
